# Default profile: local development (docker-compose: plain PostgreSQL + Redis).
spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo}
    username: ${DB_USER:todo}
    password: ${DB_PASSWORD:todo}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s

server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

todo:
  version: ${APP_VERSION:dev}
  database-host: ${DB_HOST:localhost}
  cache:
    ttl: PT5M

---
# AWS profile: RDS Proxy with IAM authentication through the AWS Advanced JDBC Wrapper.
# The wrapper's IAM plugin signs a short-lived auth token with the ECS task role
# (AWS SDK default credentials chain); TLS is required by the proxy.
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: jdbc:aws-wrapper:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?wrapperPlugins=iam&iamRegion=${AWS_REGION}&sslmode=require
    driver-class-name: software.amazon.jdbc.Driver
    username: ${DB_USER}
    password: ""
    hikari:
      maximum-pool-size: 5
      # IAM tokens are valid for 15 minutes; recycle pooled connections before that.
      max-lifetime: 840000
