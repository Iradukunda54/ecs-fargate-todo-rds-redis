name: App - build and push image

# Builds and tests app/, builds the container image and pushes it to Amazon ECR
# (tags: <git sha> and latest) using GitHub OIDC - no long-lived AWS credentials.
# The push of :latest is picked up by EventBridge, which starts the CodePipeline
# blue/green deployment to ECS.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-build-push.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

concurrency:
  group: app-image
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  ECR_REPOSITORY: todo-app

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  build-and-push:
    needs: test
    # Skipped until the ECR_PUSH_ROLE variable (foundation output GitHubEcrPushRoleArn) is set.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ECR_PUSH_ROLE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume ECR push role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.ECR_PUSH_ROLE }}
          role-session-name: app-image-build

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          VERSION="${GITHUB_SHA::7}"
          docker build --build-arg APP_VERSION="$VERSION" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Push image (sha tag first, then latest to trigger the deployment)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "### Pushed \`$IMAGE:${GITHUB_SHA::7}\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
