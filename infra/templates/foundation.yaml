AWSTemplateFormatVersion: "2010-09-09"
Description: >
  To-Do on ECS Fargate - foundation: multi-AZ VPC with dedicated subnet tiers (public/ALB,
  app/ECS, database, RDS Proxy, cache), least-privilege security groups, VPC endpoints
  (ECR, CloudWatch Logs, S3), ECR repository, RDS PostgreSQL behind RDS Proxy (IAM auth),
  ElastiCache for Redis, and the GitHub Actions OIDC role that pushes images to ECR.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedPattern: "^db\\.t3\\..+$"
    Description: RDS instance class (db.t3 family).
  DbMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ standby for RDS (doubles the database cost).
  DbName:
    Type: String
    Default: todo
  DbUsername:
    Type: String
    Default: todo_admin
  CacheNodeType:
    Type: String
    Default: cache.t3.micro
  CacheReplicas:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Redis read replicas in the second AZ (1 enables Multi-AZ automatic failover).
  EcrRepositoryName:
    Type: String
    Default: todo-app
  GitHubOidcSubject:
    Type: String
    Description: >
      GitHub OIDC `sub` claim allowed to push images (this repository's main branch).

Conditions:
  HasCacheReplica: !Equals [!Ref CacheReplicas, 1]

Mappings:
  # AWS-managed prefix list for S3 in each region (used to scope ECS egress to the S3 gateway endpoint).
  S3PrefixList:
    eu-west-1:
      Id: pl-6da54004

Resources:
  # ================================================================== Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- Public tier (ALB only)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"
        - Key: Tier
          Value: public
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"
        - Key: Tier
          Value: public

  # --- App tier (ECS tasks + interface endpoint ENIs)
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-a"
        - Key: Tier
          Value: app
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-b"
        - Key: Tier
          Value: app

  # --- Database tier (RDS PostgreSQL)
  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [20, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-a"
        - Key: Tier
          Value: database
  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [21, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-b"
        - Key: Tier
          Value: database

  # --- RDS Proxy tier
  ProxySubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [30, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-proxy-a"
        - Key: Tier
          Value: proxy
  ProxySubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [31, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-proxy-b"
        - Key: Tier
          Value: proxy

  # --- Cache tier (ElastiCache Redis)
  CacheSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [40, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-a"
        - Key: Tier
          Value: cache
  CacheSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [41, !Cidr [!Ref VpcCidr, 64, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-b"
        - Key: Tier
          Value: cache

  # --- Route tables: public -> IGW; app -> local + S3 gateway endpoint; data tiers -> local only
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-rt"
  AppSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable
  AppSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-data-rt"
  DbSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DataRouteTable
  DbSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DataRouteTable
  ProxySubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnetA
      RouteTableId: !Ref DataRouteTable
  ProxySubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnetB
      RouteTableId: !Ref DataRouteTable
  CacheSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnetA
      RouteTableId: !Ref DataRouteTable
  CacheSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnetB
      RouteTableId: !Ref DataRouteTable

  # ================================================================== Security groups
  # One security group per resource type. Every rule references another group (or the S3
  # prefix list); there is no 0.0.0.0/0 except HTTP into the public ALB.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB - HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from the internet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - traffic from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !FindInMap [S3PrefixList, !Ref "AWS::Region", Id]
          Description: S3 gateway endpoint (ECR image layers)
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-sg"

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from ECS tasks only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 127.0.0.1/32
          Description: No outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-endpoints-sg"

  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Proxy - PostgreSQL from ECS tasks only
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-proxy-sg"

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - from RDS Proxy only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 127.0.0.1/32
          Description: No outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis - from ECS tasks only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 127.0.0.1/32
          Description: No outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-sg"

  # Cross-group rules are separate resources to avoid circular dependencies.
  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      Description: To ECS tasks
  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: From the ALB
  AppToEndpointsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: To interface VPC endpoints (ECR, CloudWatch Logs)
  EndpointsFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: From ECS tasks
  AppToProxyEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref ProxySecurityGroup
      Description: To RDS Proxy
  ProxyFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: From ECS tasks
  ProxyToDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSecurityGroup
      Description: To RDS PostgreSQL
  DbFromProxyIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ProxySecurityGroup
      Description: From RDS Proxy
  AppToCacheEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSecurityGroup
      Description: To ElastiCache Redis
  CacheFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: From ECS tasks

  # ================================================================== VPC endpoints (no NAT gateway)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref AppRouteTable
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ================================================================== ECR
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 15 most recent images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 15},
                "action": {"type": "expire"}
              }
            ]
          }

  # GitHub Actions (this repo's main branch) -> push images to this repository only.
  # Uses the account's existing GitHub OIDC provider.
  GitHubEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions via OIDC to push application images to ECR
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn

  # ================================================================== RDS PostgreSQL
  # Credentials RDS Proxy uses to log in to the database. The application never sees them:
  # it authenticates to the proxy with IAM.
  DbCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-db-credentials"
      Description: Master credentials of the To-Do PostgreSQL database (used by RDS Proxy)
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\ '''

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Dedicated database subnets
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DbName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbCredentials}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbCredentials}:SecretString:password}}"
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DbMultiAZ
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql]

  DbCredentialsAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbCredentials
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  # ================================================================== RDS Proxy (IAM auth, TLS required)
  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets RDS Proxy read the database credentials
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbCredentials

  DbProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "${AWS::StackName}-proxy"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt ProxyRole.Arn
      RequireTLS: true
      IdleClientTimeout: 1800
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DbCredentials
          IAMAuth: REQUIRED
          ClientPasswordAuthType: POSTGRES_SCRAM_SHA_256
      VpcSubnetIds: [!Ref ProxySubnetA, !Ref ProxySubnetB]
      VpcSecurityGroupIds: [!Ref ProxySecurityGroup]

  DbProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    DependsOn: DbCredentialsAttachment
    Properties:
      DBProxyName: !Ref DbProxy
      TargetGroupName: default
      DBInstanceIdentifiers: [!Ref Database]
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

  # ================================================================== ElastiCache for Redis
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Dedicated cache subnets
      SubnetIds: [!Ref CacheSubnetA, !Ref CacheSubnetB]

  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: To-Do read cache
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: !If [HasCacheReplica, 2, 1]
      AutomaticFailoverEnabled: !If [HasCacheReplica, true, false]
      MultiAZEnabled: !If [HasCacheReplica, true, false]
      Port: 6379
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      SnapshotRetentionLimit: 0
      AutoMinorVersionUpgrade: true

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnets"
  AppSubnets:
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnets"
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AlbSecurityGroupId"
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AppSecurityGroupId"
  RepositoryName:
    Value: !Ref Repository
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryName"
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryArn"
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
  GitHubEcrPushRoleArn:
    Description: Set as the ECR_PUSH_ROLE repository variable
    Value: !GetAtt GitHubEcrPushRole.Arn
  DbProxyEndpoint:
    Value: !GetAtt DbProxy.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-DbProxyEndpoint"
  DbProxyResourceId:
    Description: prx-... id used in the rds-db:connect resource ARN
    Value: !Select [6, !Split [":", !GetAtt DbProxy.DBProxyArn]]
    Export:
      Name: !Sub "${AWS::StackName}-DbProxyResourceId"
  DbName:
    Value: !Ref DbName
    Export:
      Name: !Sub "${AWS::StackName}-DbName"
  DbUsername:
    Value: !Ref DbUsername
    Export:
      Name: !Sub "${AWS::StackName}-DbUsername"
  CacheEndpoint:
    Value: !GetAtt Cache.PrimaryEndPoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-CacheEndpoint"
  CachePort:
    Value: !GetAtt Cache.PrimaryEndPoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-CachePort"
